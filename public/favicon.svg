<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <radialGradient id="blackHole" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#000000;stop-opacity:1" />
      <stop offset="40%" style="stop-color:#1a1a2e;stop-opacity:1" />
      <stop offset="70%" style="stop-color:#8b78ff;stop-opacity:0.8" />
      <stop offset="100%" style="stop-color:#ff8c69;stop-opacity:0.6" />
    </radialGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:0.9" />
      <stop offset="50%" style="stop-color:#8b78ff;stop-opacity:0.4" />
      <stop offset="100%" style="stop-color:#000000;stop-opacity:0" />
    </radialGradient>
  </defs>
  
  <!-- Background -->
  <rect width="100" height="100" fill="#0f1724"/>
  
  <!-- Outer glow -->
  <circle cx="50" cy="50" r="45" fill="url(#glow)" opacity="0.6"/>
  
  <!-- Event horizon ring -->
  <circle cx="50" cy="50" r="35" fill="none" stroke="#ff8c69" stroke-width="2" opacity="0.8"/>
  <circle cx="50" cy="50" r="30" fill="none" stroke="#8b78ff" stroke-width="2" opacity="0.9"/>
  
  <!-- Black hole center -->
  <circle cx="50" cy="50" r="25" fill="url(#blackHole)"/>
  
  <!-- Inner darkness -->
  <circle cx="50" cy="50" r="15" fill="#000000"/>
  
  <!-- Accretion disk effect -->
  <ellipse cx="50" cy="50" rx="40" ry="12" fill="none" stroke="#8b78ff" stroke-width="1.5" opacity="0.5" transform="rotate(-20 50 50)"/>
  <ellipse cx="50" cy="50" rx="38" ry="10" fill="none" stroke="#ff8c69" stroke-width="1" opacity="0.4" transform="rotate(-20 50 50)"/>
  
  <!-- Light particles -->
  <circle cx="20" cy="30" r="1.5" fill="#ffffff" opacity="0.9"/>
  <circle cx="75" cy="25" r="1" fill="#ffffff" opacity="0.8"/>
  <circle cx="80" cy="60" r="1.2" fill="#ffffff" opacity="0.7"/>
  <circle cx="25" cy="70" r="1" fill="#ffffff" opacity="0.8"/>
</svg>
