name: Update Visitor Counter

on:
  repository_dispatch:
    types: [new-visitor]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-counter:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          persist-credentials: true

      - name: Increment visitor count
        run: |
          CURRENT=$(python3 -c "import json; print(json.load(open('public/visitor-count.json'))['count'])" 2>/dev/null || echo "0")
          NEW_COUNT=$((CURRENT + 1))
          echo "{\"count\": $NEW_COUNT}" > public/visitor-count.json
          echo "Visitor count: $CURRENT -> $NEW_COUNT"

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/visitor-count.json
          git diff --staged --quiet || git commit -m "chore: update visitor count [skip ci]"
          git push
