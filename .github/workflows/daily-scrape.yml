name: Scrape Every 12 Hours

on:
  schedule:
    # Run every 12 hours (at 00:00 and 12:00 UTC)
    - cron: '0 */12 * * *'
  workflow_dispatch: # Allow manual trigger

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          persist-credentials: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Scrape Genshin Impact Events
        run: node scripts/scrapeGenshinCurrentUpcoming.js
        continue-on-error: true

      - name: Scrape Honkai Star Rail
        run: |
          node scripts/scrapeStarRailCurrentUpcoming.js
          node scripts/scrapeStarRailEndgame.js
        continue-on-error: true

      - name: Scrape Zenless Zone Zero Events
        run: node scripts/scrapeZZZCurrentUpcoming.js
        continue-on-error: true

      - name: Scrape Wuthering Waves Events
        run: node scripts/scrapeWuwaCurrentUpcoming.js
        continue-on-error: true

      - name: Archive ended events
        run: npm run archive
        continue-on-error: true

      - name: Check for changes
        id: git-check
        run: |
          git add src/data/*.js src/data/*.json public/images/
          git diff --cached --exit-code || echo "changes=true" >> $GITHUB_OUTPUT

      - name: Commit and push if changes
        if: steps.git-check.outputs.changes == 'true'
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git commit -m "chore: automated scrape update - $(date +'%Y-%m-%d %H:%M UTC')"
          git push origin main
