name: Scrape Genshin Impact

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scrape-genshin:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          persist-credentials: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Puppeteer browser
        run: npx puppeteer browsers install chrome

      - name: Test Game8 access with curl
        run: |
          echo "Testing direct HTTP access to Game8..."
          echo "=== curl with follow redirects and verbose output ==="
          curl -I -L -v https://game8.co/games/Genshin-Impact/archives/305012 || true
          echo ""
          echo "=== Testing with different User-Agent ==="
          curl -I -L -A "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36" https://game8.co/games/Genshin-Impact/archives/305012 || true
          echo ""
          echo "=== IP address of this runner ==="
          curl -s https://api.ipify.org
          echo ""
        continue-on-error: true

      - name: Scrape Genshin Current & Upcoming Events
        env:
          FANDOM_USERNAME: ${{ secrets.FANDOM_USERNAME }}
          FANDOM_PASSWORD: ${{ secrets.FANDOM_PASSWORD }}
        run: node scripts/scrapeGenshinCurrentUpcoming.js
        continue-on-error: true

      - name: Scrape Genshin Banners
        env:
          FANDOM_USERNAME: ${{ secrets.FANDOM_USERNAME }}
          FANDOM_PASSWORD: ${{ secrets.FANDOM_PASSWORD }}
        run: node scripts/scrapeGenshinBanners.js
        continue-on-error: true

      - name: Check for changes
        id: git-check
        run: |
          git add src/data/*.js src/data/*.json public/images/
          git diff --cached --exit-code || echo "changes=true" >> $GITHUB_OUTPUT

      - name: Commit and push if changes
        if: steps.git-check.outputs.changes == 'true'
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git commit -m "chore: scrape Genshin Impact - $(date +'%Y-%m-%d %H:%M UTC')"
          git push origin main
